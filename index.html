    case 1:return[body+Math.sin(t*2.4-p.y*0.4)*(0.3+2*p.hw),by+Math.sin(t*2.4-p.x*0.3)*0.3*p.hw];
    case 2:return[Math.cos(t*1.9)*1.8,Math.sin(t*2.3)*2.2];
    case 3:return[Math.cos(t*1.5+1)*1.5,Math.sin(t*2+1)*2];
    case 4:return[Math.cos(t*1.7+2)*1.5,Math.sin(t*2.1+2)*2];
    case 5:return[Math.sin(t*3+p.x*0.4)*1,Math.sin(t*2.2+p.x*0.3)*0.8];
    case 6:return[body+Math.sin(t*2+p.y*0.3)*1.3,by+Math.cos(t*1.8+p.y*0.3)*1.2];
    default:return[Math.cos(t*1.6)*1.4,Math.sin(t*2)*1.8];
  }
}

let t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;
  g.globalAlpha=1;g.fillStyle="#000";g.fillRect(0,0,W*cw,H*ch);
  const s=ss(0,1.4,t)*(1-ss(7.5,10.5,t)),tt=t<6?t:6+(t-6)*2;
  if(s>0.04){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const v=bh(x,y,tt,s);
      if(v>=0){g.fillStyle=AMB[v];g.fillText(RAMP[v],x*cw,y*ch)}
      else if(hs(y,x)<0.01){g.fillStyle="#777";g.fillText(Math.sin(t*2+x*3+y)>0?".":"*",x*cw,y*ch)}
    }
  }else if(t>10){
    for(let i=0;i<40;i++){
      const px=hs(i,7)*W,py=H-((t*(1+hs(i,8)*2)*3+hs(i,9)*H)%H);
      g.fillStyle=i%2?"#ff5fc8":"#8a6bff";g.globalAlpha=0.6;g.fillText(".",px*cw,py*ch)
    }
  }
  for(let i=0;i<P.length;i++){
    const p=P[i],u=(t-p.t0)/p.dur;
    if(u<=0)continue;
    const e=u>=1?1:1-Math.pow(1-u,3);
    const sx=CX+Math.cos(p.a)*p.r,sy=CY+Math.sin(p.a)*p.r*0.5;
    const dx=p.x-sx,dy=p.y-sy,L=Math.hypot(dx,dy)||1;
    const sinw=Math.sin(e*Math.PI)*p.sw*(1-e*0.3);
    let x=sx+dx*e+(-dy/L)*sinw,y=sy+dy*e+(dx/L)*sinw*0.5;
    const m=ss(0.75,1,u);
    if(m>0){const mo=motion(p,t);x+=mo[0]*m;y+=mo[1]*m}
    let al=Math.min(1,u*3);
    if(p.pk&&u>=1)al=0.7+0.3*Math.sin(t*4+p.x*0.5+p.y*0.3);
    g.globalAlpha=al;
    g.fillStyle=u<1&&u<0.5?"#ff8fe0":COL[i];
    g.fillText(CD[i][2],x*cw,y*ch);
  }
  g.globalAlpha=1;
  if(t>12){
    const title="H  U  S  H",n=Math.min(title.length,Math.floor((t-12)*5));
    g.fillStyle="#ff8fe0";
    for(let i=0;i<n;i++)g.fillText(title[i],(4+i)*cw,4*ch);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.body.addEventListener("click",()=>{t0=performance.now()});
</script>
