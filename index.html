<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi Ki Doğdun Azra!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Konfeti Efekti */
        .confetti-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff7675;
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Ana Kart Tasarımı */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform: translateY(0);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            color: #2d3436;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: #6c5ce7;
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #636e72;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Buton Tasarımı */
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 20px rgba(108, 92, 231, 0.4);
            background: linear-gradient(45deg, #a29bfe, #6c5ce7);
        }

        .btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="confetti-container" id="confetti"></div>

    <div class="card">
        <div class="icon">🎉</div>
        <h1>Mutlu Yıllar, <br><span>Azra!</span></h1>
        <p>Yeni yaşının sana sağlık, mutluluk, başarı ve tüm güzellikleri beraberinde getirmesini dilerim. İyi ki doğdun, iyi ki varsın!</p>
        <button class="btn" onclick="makeMoreConfetti()">Kutlamayı Başlat ✨</button>
    </div>

    <script>
        // Rastgele konfeti oluşturma fonksiyonu
        function createConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#6c5ce7', '#a29bfe', '#ff7675', '#fab1a0', '#fdcb6e', '#00cec9'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Rastgele özellikler
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = confetti.style.height = (Math.random() * 6 + 6) + 'px';
                
                container.appendChild(confetti);
            }
        }

        // Sayfa açıldığında konfetileri başlat
        createConfetti();

        // Butona basıldığında ekstra patlama efekti
        function makeMoreConfetti() {
            createConfetti();
            // 5 saniye sonra eski konfetileri temizle (sayfa kasmasın diye)
            setTimeout(() => {
                const container = document.getElementById('confetti');
                while (container.childNodes.length > 100) {
                    container.removeChild(container.firstChild);
                }
            }, 5000);
        }
    </script>
</body>
</html>
